[pytest]
# Registered so an unmarked typo is an error rather than a silently-ignored marker.
#
# crossuid — tests that run a REAL `sudo -n -u #<uid>` probe against the dual-user
#   rig's second QA identity. They prove the one criterion a same-uid test can never
#   establish: that a credential is readable BY ITS CONSUMER (T022 ARRANGE §2 I4,
#   #452/#456 V2). A credential readable by the uid that WROTE it proves nothing.
#
#   These FAIL rather than skip when the second identity or passwordless sudo is
#   absent. A skipped test reads as green while proving nothing, which is the exact
#   class of silence the arrange phase exists to end — so a host that cannot prove the
#   criterion must say so out loud. Deselect DELIBERATELY where the rig does not exist
#   (CI runners have no valbot):
#
#       python3 -m pytest tests/ -q -m 'not crossuid'
markers =
    crossuid: requires the dual-user rig's second QA identity and passwordless sudo to it
