name: CI

# Build + verify the Trailborne mod on every push and PR that can affect it.
# The crux: a CI runner has no Valheim. We pull the FREE dedicated-server
# assemblies via SteamCMD (app 896660, anonymous login — no game ownership,
# nothing copyrighted committed). Those carry the full reference set the net48
# build needs (game assemblies + the BCL: mscorlib/System/netstandard), which
# is exactly why this compiles on Linux without mono.

on:
  push:
    branches: [main, v1]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'qa/**'
      - 'tools/stone-content-workbench/**'
      - 'Directory.Build.props'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'qa/**'
      - 'tools/stone-content-workbench/**'
      - 'Directory.Build.props'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VALHEIM_SERVER_APPID: '896660'   # Valheim Dedicated Server (free, anonymous)
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # ── Valheim dedicated-server managed assemblies (build references) ──────
      # Cached by the appid + a weekly epoch so we don't hammer Steam every run
      # but still pick up server updates. Cache key bumps when this file changes.
      - name: Compute weekly cache epoch
        id: weekstamp
        run: echo "week=$(( $(date +%s) / 604800 ))" >> "$GITHUB_OUTPUT"

      - name: Cache Valheim server assemblies
        id: cache-valheim
        uses: actions/cache@v5
        with:
          path: ~/valheim-server/valheim_server_Data/Managed
          key: valheim-managed-${{ env.VALHEIM_SERVER_APPID }}-${{ hashFiles('.github/workflows/ci.yml') }}-week${{ steps.weekstamp.outputs.week }}

      - name: Install SteamCMD + fetch server assemblies (on cache miss)
        if: steps.cache-valheim.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo add-apt-repository -y multiverse
          sudo dpkg --add-architecture i386
          sudo apt-get update
          echo steam steam/question select "I AGREE" | sudo debconf-set-selections
          echo steam steam/license note '' | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y steamcmd
          # The Steam fetch is the flaky step (transient apt mirror / Steam
          # rate-limit-timeout / runner disk pressure / "Missing configuration"
          # on a multi-hundred-MB pull). Harden identically to release.yml per the
          # 2026-06-06 investigation: (1) retry up to 3× with linear backoff,
          # (2) loop on the ARTIFACT existing — not steamcmd's exit code, which it
          # lies about — and (3) drop `validate` (it re-hashes every file: slower +
          # more timeout-prone; the anonymous download is already Steam-integrity-checked).
          MANAGED="$HOME/valheim-server/valheim_server_Data/Managed"
          n=0
          until [ -f "$MANAGED/assembly_valheim.dll" ] || [ "$n" -ge 3 ]; do
            n=$((n+1))
            echo "::group::steamcmd attempt $n/3"
            steamcmd +force_install_dir "$HOME/valheim-server" \
                     +login anonymous \
                     +app_update "$VALHEIM_SERVER_APPID" \
                     +quit || true
            echo "::endgroup::"
            [ -f "$MANAGED/assembly_valheim.dll" ] && break
            echo "attempt $n did not produce the Managed assemblies; sleeping $((n*15))s before retry"
            sleep $((n*15))
          done
          # Real success gate — the DLL is present or the step fails loudly.
          ls "$MANAGED/assembly_valheim.dll"

      - name: Point the build at the server assemblies
        run: |
          echo "VALHEIM_MANAGED=$HOME/valheim-server/valheim_server_Data/Managed" >> "$GITHUB_ENV"

      # ── BepInEx core (compile references for HarmonyX/BepInEx) ──────────────
      - name: Fetch BepInEx SDK
        run: |
          set -euo pipefail
          bash scripts/fetch-sdk.sh
          echo "BEPINEX_CORE=$GITHUB_WORKSPACE/.sdk/BepInExPack_Valheim/BepInEx/core" >> "$GITHUB_ENV"

      - name: NuGet cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-

      - name: Build (Release)
        run: |
          dotnet build src/SBPR.Trailborne/SBPR.Trailborne.csproj -c Release \
            -warnaserror:CS0246,CS0103,CS1061 \
            | tee build.log
          test -f src/SBPR.Trailborne/bin/Release/SBPR.Trailborne.dll

      # ── Niflheim Homestead Stones mod (Release, 0w/0e) ─────────────────────
      # R6 (Blocker 7): the net48 realization adapters — static-geometry catalog
      # loader, operational-manifest store, atomic ledger store, world-placement
      # patch, and the load-bearing runtime drift check — are NOT link-compiled by
      # the engine-free test suite (they reference live Unity/BepInEx types). CI
      # must compile them against the real SDK so an adapter/provider/store/manifest/
      # drift regression fails the build here, not only in a local dev tree.
      - name: Build Homestead Stones mod (Release)
        run: |
          dotnet build src/SBPR.Niflheim.HomesteadStones/SBPR.Niflheim.HomesteadStones.csproj -c Release \
            | tee homestead-build.log
          test -f src/SBPR.Niflheim.HomesteadStones/bin/Release/SBPR.Niflheim.HomesteadStones.dll

      # ── Structural test suite (CLEANUP 3/3, card t_4364809c) ────────────────
      # xUnit over the SHIPPED engine-free contracts (link-compiled: the hover-hint
      # decision table + BoundedMapMath windowed-fog geometry). Needs NO Valheim SDK
      # — it references no game/BepInEx assemblies — so it gates independently of the
      # server-asset fetch above. This is the test execution CI did not run before:
      # the old job only asserted the DLL built. tests/Directory.Build.props shields
      # this subtree from the repo-root SDK-path validation.
      - name: Test (Release)
        run: |
          dotnet test tests/SBPR.Trailborne.Tests.csproj -c Release \
            --logger "console;verbosity=normal"

      # ── Drift guard: the reflection targets the client-refresh layer depends
      # on are PRIVATE/named vanilla members. If a Valheim update renames one,
      # the patch silently no-ops ("logs green != playable"). Verify they still
      # resolve against the real game assembly — the same check done by hand on
      # 2026-06-04, now automated so the regression can never ship unseen.
      - name: Verify reflection targets resolve against assembly_valheim.dll
        run: |
          set -euo pipefail
          mkdir -p .ci/apiprobe && cd .ci/apiprobe
          cat > apiprobe.csproj <<'CSPROJ'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <Nullable>disable</Nullable>
              <ImplicitUsings>disable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="System.Reflection.MetadataLoadContext" Version="8.0.0" />
            </ItemGroup>
          </Project>
          CSPROJ
          cat > Program.cs <<'CS'
          using System; using System.IO; using System.Linq; using System.Reflection;
          class Probe {
            static int Main() {
              string managed = Environment.GetEnvironmentVariable("VALHEIM_MANAGED");
              var asm = Path.Combine(managed, "assembly_valheim.dll");
              var resolver = new PathAssemblyResolver(Directory.GetFiles(managed, "*.dll").ToList());
              using var mlc = new MetadataLoadContext(resolver);
              var a = mlc.LoadFromAssemblyPath(asm);
              const BindingFlags ALL = BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance|BindingFlags.Static|BindingFlags.DeclaredOnly;
              int fails = 0;
              void Check(string label, bool ok){ Console.WriteLine($"{(ok?"PASS":"FAIL")}  {label}"); if(!ok) fails++; }
              var player = a.GetType("Player");
              Check("Player.UpdateKnownRecipesList()", player?.GetMethod("UpdateKnownRecipesList", ALL) != null);
              Check("Player.OnSpawned(bool)", player?.GetMethod("OnSpawned", ALL) != null);
              // T030 Ready Hands runtime binding: ReadyHandsEquipDurationPatch postfixes these two PRIVATE
              // Player methods. QA t_2b1e690d proved the accepted PR bound them to Humanoid (zero methods
              // resolved) so the effect never fired in-world. Fail the build if the live binding target
              // regresses — a non-tautological guard that a joined client can actually be patched.
              var itemData = a.GetType("ItemDrop+ItemData");
              var equipArgs = itemData != null ? new[] { itemData } : null;
              Check("Player.QueueEquipAction(ItemDrop.ItemData)  [T030 Ready Hands bind]",
                  equipArgs != null && player?.GetMethod("QueueEquipAction", ALL, null, equipArgs, null) != null);
              Check("Player.QueueUnequipAction(ItemDrop.ItemData)  [T030 Ready Hands bind]",
                  equipArgs != null && player?.GetMethod("QueueUnequipAction", ALL, null, equipArgs, null) != null);
              Check("Player.m_actionQueue  [T030 Ready Hands scale target]", player?.GetField("m_actionQueue", ALL) != null);
              var pt = a.GetType("PieceTable");
              Check("PieceTable.UpdateAvailable", pt?.GetMethod("UpdateAvailable", ALL) != null);
              Check("PieceTable.m_availablePieces", pt?.GetField("m_availablePieces", ALL) != null);
              Check("PieceTable.m_selectedPiece", pt?.GetField("m_selectedPiece", ALL) != null);
              Check("PieceTable.m_lastSelectedPiece", pt?.GetField("m_lastSelectedPiece", ALL) != null);
              var piece = a.GetType("Piece");
              var pcat = piece?.GetNestedType("PieceCategory", ALL);
              Check("Piece.PieceCategory.Max", pcat?.GetField("Max", BindingFlags.Public|BindingFlags.Static) != null);
              Console.WriteLine(fails==0 ? "RESULT: ALL REFLECTION TARGETS RESOLVE" : $"RESULT: {fails} MISSING");
              return fails==0 ? 0 : 1;
            }
          }
          CS
          dotnet run -c Release

      - name: Pack modpack (artifact for inspection)
        run: |
          bash scripts/pack-modpack.sh \
            --dll src/SBPR.Trailborne/bin/Release/SBPR.Trailborne.dll \
            --out dist

      - name: Upload modpack artifact
        uses: actions/upload-artifact@v7
        with:
          name: SBPR-Trailborne-Modpack
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # ── Stone Content Authoring Workbench (POC, card t_e2de37e4) ──────────────────
  # A fully engine-free net8 tool: it references NO game/BepInEx/Valheim assemblies,
  # so it runs headless with NO SteamCMD fetch. Kept as an independent job (not a step
  # of `build`) so a workbench-only change gets a fast, self-contained gate and the
  # Valheim-dependent build path is never on its critical path.
  workbench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: NuGet cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-workbench-${{ hashFiles('tools/stone-content-workbench/**/*.csproj') }}
          restore-keys: nuget-workbench-

      - name: Test (Release)
        run: |
          dotnet test tools/stone-content-workbench/tests/StoneContent.Workbench.Tests.csproj -c Release \
            --logger "console;verbosity=normal"

      - name: Build the local web workbench (loopback host + static UI)
        run: |
          dotnet build tools/stone-content-workbench/src/StoneContent.Workbench.Web/StoneContent.Workbench.Web.csproj \
            -c Release
          # The static frontend must ship with the adapter.
          test -f tools/stone-content-workbench/src/StoneContent.Workbench.Web/wwwroot/index.html
          test -f tools/stone-content-workbench/src/StoneContent.Workbench.Web/wwwroot/app.js
          test -f tools/stone-content-workbench/src/StoneContent.Workbench.Web/wwwroot/styles.css

      - name: CLI validate the canonical asset
        run: |
          dotnet run --project tools/stone-content-workbench/src/StoneContent.Workbench.Cli -c Release -- \
            validate tools/stone-content-workbench/assets/homestead-stone.content.json

      - name: Deterministic double-generation is byte-identical
        run: |
          set -euo pipefail
          CLI=tools/stone-content-workbench/src/StoneContent.Workbench.Cli
          ASSET=tools/stone-content-workbench/assets/homestead-stone.content.json
          dotnet run --project "$CLI" -c Release -- generate "$ASSET" --output "$RUNNER_TEMP/gen1"
          dotnet run --project "$CLI" -c Release -- generate "$ASSET" --output "$RUNNER_TEMP/gen2"
          diff -r "$RUNNER_TEMP/gen1" "$RUNNER_TEMP/gen2"

      - name: CLI check generated output for drift
        run: |
          dotnet run --project tools/stone-content-workbench/src/StoneContent.Workbench.Cli -c Release -- \
            check tools/stone-content-workbench/assets/homestead-stone.content.json --generated "$RUNNER_TEMP/gen1"

  # ── QA test-harness (ADR-0009 M0) ────────────────────────────────────────────
  # The QA-only, fail-closed test-helper subsystem (qa/**). Kept in its OWN job so
  # a harness change is gated independently and NEVER sits on the product build's
  # critical path (ADR-0009 §7). Proves the two M0 structural-firewall gates plus
  # an inert helper Release build.
  qa-harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # AT-QA-NO-PRODUCT-REF (direction a+b): qa/** and src/SBPR.* are
      # dependency-disjoint. Structural project-XML parse, engine-free — no SDK
      # needed, so it gates fast and first.
      - name: 'AT-QA-NO-PRODUCT-REF — bidirectional dependency guard'
        run: python3 scripts/check-qa-dependency-boundary.py

      # AT-QA-MODPACK-EXCLUDES-HARNESS + AT-QA-NO-PRODUCT-REF isolation suite,
      # including the adversarial rename/case/nested/traversal negative fixtures.
      - name: 'M0 isolation guard tests (unittest, no pip)'
        run: python3 -m unittest discover -s qa/tests -p 'test_*.py' -v

      # Runner skeleton must be import/execute-clean and side-effect-free.
      - name: 'Runner skeleton --dry-run (no game/network/file I/O)'
        run: python3 qa/runner/sbpr-qa-t022.py --dry-run

      # ADR-0009 M1: engine-free contracts + capability parser + fail-closed arming
      # gate. This xUnit suite link-compiles the SHIPPED engine-free contract sources
      # (System.* only — no game/BepInEx), so it runs headless with NO Valheim SDK and
      # gates FIRST, off the helper's SteamCMD critical path. Named ATs:
      # AT-QA-DISABLED-BY-DEFAULT, PROD-WORLD-REJECT, EXACT-WORLD-UID, BAD-NONCE-REJECT,
      # OUT-OF-MANIFEST-REJECT, OUT-OF-BOUNDS-ARG-REJECT, REPLAY-REJECT.
      - name: 'AT-QA M1 — engine-free contracts + arming gate (xUnit, no SDK)'
        run: |
          dotnet test qa/tests-core/SBPR.QaHarness.T022.Core.Tests.csproj -c Release \
            --logger "console;verbosity=normal"

      # ── Valheim dedicated-server managed assemblies (helper build references) ─
      - name: Compute weekly cache epoch
        id: weekstamp
        run: echo "week=$(( $(date +%s) / 604800 ))" >> "$GITHUB_OUTPUT"

      - name: Cache Valheim server assemblies
        id: cache-valheim
        uses: actions/cache@v5
        with:
          path: ~/valheim-server/valheim_server_Data/Managed
          key: valheim-managed-${{ env.VALHEIM_SERVER_APPID }}-${{ hashFiles('.github/workflows/ci.yml') }}-week${{ steps.weekstamp.outputs.week }}

      - name: Install SteamCMD + fetch server assemblies (on cache miss)
        if: steps.cache-valheim.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo add-apt-repository -y multiverse
          sudo dpkg --add-architecture i386
          sudo apt-get update
          echo steam steam/question select "I AGREE" | sudo debconf-set-selections
          echo steam steam/license note '' | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y steamcmd
          MANAGED="$HOME/valheim-server/valheim_server_Data/Managed"
          n=0
          until [ -f "$MANAGED/assembly_valheim.dll" ] || [ "$n" -ge 3 ]; do
            n=$((n+1))
            echo "::group::steamcmd attempt $n/3"
            steamcmd +force_install_dir "$HOME/valheim-server" \
                     +login anonymous \
                     +app_update "$VALHEIM_SERVER_APPID" \
                     +quit || true
            echo "::endgroup::"
            [ -f "$MANAGED/assembly_valheim.dll" ] && break
            echo "attempt $n did not produce the Managed assemblies; sleeping $((n*15))s before retry"
            sleep $((n*15))
          done
          ls "$MANAGED/assembly_valheim.dll"

      - name: Point the build at the server assemblies
        run: echo "VALHEIM_MANAGED=$HOME/valheim-server/valheim_server_Data/Managed" >> "$GITHUB_ENV"

      - name: Fetch BepInEx SDK
        run: |
          set -euo pipefail
          bash scripts/fetch-sdk.sh
          echo "BEPINEX_CORE=$GITHUB_WORKSPACE/.sdk/BepInExPack_Valheim/BepInEx/core" >> "$GITHUB_ENV"

      - name: NuGet cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-qa-${{ hashFiles('qa/**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-

      # Helper Release build: net48, 0 warnings / 0 errors, inert/default-disabled.
      - name: Build QA helper (Release, 0w/0e, inert)
        run: |
          dotnet build qa/SBPR.QaHarness.T022/SBPR.QaHarness.T022.csproj -c Release \
            | tee qa-build.log
          test -f qa/SBPR.QaHarness.T022/bin/Release/SBPR.QaHarness.T022.dll

      # The freshly-built helper DLL must still be rejected by the modpack
      # exclusion guard by CONTENT signature (renamed or not) — proves the gate
      # catches the real artifact, not just a synthetic fixture.
      - name: 'AT-QA-MODPACK-EXCLUDES-HARNESS — real helper DLL rejected by content signature'
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/BepInEx/plugins/Innocent"
          cp qa/SBPR.QaHarness.T022/bin/Release/SBPR.QaHarness.T022.dll \
             "$STAGE/BepInEx/plugins/Innocent/renamed-to-look-legit.dll"
          if python3 scripts/check-modpack-excludes-harness.py --tree "$STAGE"; then
            echo "GUARD FAILED TO DETECT the real (renamed) helper DLL"; exit 1
          fi
          echo "OK: guard detected the real helper DLL under a renamed path"
